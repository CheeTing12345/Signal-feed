<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Signal Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080D;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.07);
    --text: #E8E6FF;
    --muted: rgba(255,255,255,0.35);
    --dim: rgba(255,255,255,0.15);
    --orange: #FF6B35;
    --purple: #9B7EFF;
    --teal: #00D4AA;
  }

  html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  #app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }

  header { padding: 48px 0 32px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 24px; border-bottom: 1px solid var(--border); }
  .logo-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); animation: breathe 2.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
  .badge-label { font-size: 10px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  h1 { font-family: 'Syne', sans-serif; font-size: clamp(24px, 4vw, 36px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; color: #fff; }
  h1 span { color: rgba(255,255,255,0.25); }
  .last-fetched { font-size: 11px; color: var(--dim); letter-spacing: .04em; margin-top: 8px; }

  #fetch-btn {
    background: var(--orange); color: #fff;
    border: none; border-radius: 10px;
    padding: 13px 26px;
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; gap: 9px;
    transition: transform .2s, box-shadow .2s, opacity .2s;
    white-space: nowrap; letter-spacing: .02em;
  }
  #fetch-btn:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 0 28px rgba(255,107,53,.35); }
  #fetch-btn:active:not(:disabled) { transform: scale(.98); }
  #fetch-btn:disabled { opacity: .45; cursor: not-allowed; }
  #fetch-btn svg.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sources-strip { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .strip-label { font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: .12em; text-transform: uppercase; margin-right: 4px; }
  .source-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 22px 0 0; }
  .tab {
    background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    padding: 8px 16px; color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 12px;
    cursor: pointer; transition: all .15s;
    display: flex; align-items: center; gap: 8px; letter-spacing: .02em;
  }
  .tab:hover { background: rgba(255,255,255,0.05); }
  .tab.active[data-cat="design"]             { border-color: var(--orange); color: var(--orange); background: rgba(255,107,53,.1); }
  .tab.active[data-cat="product-design"]     { border-color: var(--purple); color: var(--purple); background: rgba(155,126,255,.1); }
  .tab.active[data-cat="product-management"] { border-color: var(--teal);   color: var(--teal);   background: rgba(0,212,170,.1); }
  .tab-count { border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: 500; color: #000; display: none; }
  .tab.has-count .tab-count { display: inline; }
  .tab[data-cat="design"] .tab-count            { background: var(--orange); }
  .tab[data-cat="product-design"] .tab-count    { background: var(--purple); }
  .tab[data-cat="product-management"] .tab-count { background: var(--teal); }

  #content { padding: 22px 0 0; }

  .empty-state { text-align: center; padding: 80px 20px; }
  .empty-icon { font-size: 44px; filter: grayscale(1) opacity(.25); margin-bottom: 16px; }
  .empty-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: rgba(255,255,255,.18); margin-bottom: 8px; }
  .empty-sub { font-size: 12px; color: var(--dim); line-height: 1.7; }
  .error-box { background: rgba(255,60,60,.08); border: 1px solid rgba(255,60,60,.2); border-radius: 10px; padding: 16px 20px; color: #FF7070; font-size: 13px; line-height: 1.6; }

  .skeleton { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 10px; animation: pulse 1.6s ease-in-out infinite; }
  .skel-line { background: rgba(255,255,255,0.07); border-radius: 6px; height: 11px; margin-bottom: 9px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .skel-scanning { font-size: 11px; color: var(--dim); margin-bottom: 18px; letter-spacing: .05em; }

  .card {
    display: block; text-decoration: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 10px;
    transition: opacity .15s, border-color .15s;
    animation: fadeUp .35s ease forwards; opacity: 0;
  }
  .card:hover { opacity: .75; border-color: rgba(255,255,255,0.14); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .card:nth-child(1){animation-delay:.04s} .card:nth-child(2){animation-delay:.09s}
  .card:nth-child(3){animation-delay:.14s} .card:nth-child(4){animation-delay:.19s}
  .card:nth-child(5){animation-delay:.24s} .card:nth-child(6){animation-delay:.29s}
  .card:nth-child(7){animation-delay:.34s}

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
  .card-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: #fff; line-height: 1.35; flex: 1; }
  .card-ext { flex-shrink: 0; margin-top: 2px; opacity: .25; }
  .card-snippet { font-size: 12px; color: rgba(255,255,255,.42); line-height: 1.6; margin-bottom: 12px; }
  .card-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .source-tag { display: flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 9px; border-radius: 6px; letter-spacing: .02em; }
  .card-age { font-size: 11px; color: var(--dim); letter-spacing: .03em; }

  .source-tag.design             { color: var(--orange); background: rgba(255,107,53,.12); }
  .source-tag.product-design     { color: var(--purple); background: rgba(155,126,255,.12); }
  .source-tag.product-management { color: var(--teal);   background: rgba(0,212,170,.12); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="logo-badge">
        <div class="live-dot"></div>
        <span class="badge-label">Live Signal</span>
      </div>
      <h1>AI × Design &amp; Product<br><span>Signal Feed</span></h1>
      <div class="last-fetched" id="last-fetched" style="display:none"></div>
    </div>
    <button id="fetch-btn" onclick="fetchFeed()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Load Feed
    </button>
  </header>

  <div class="sources-strip">
    <span class="strip-label">Sources</span>
    <span class="source-pill">Reddit</span>
    <span class="source-pill">YouTube</span>
    <span class="source-pill">X / Twitter</span>
    <span class="source-pill">LinkedIn</span>
    <span class="source-pill">GitHub</span>
    <span class="source-pill">Articles &amp; Papers</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-cat="design" onclick="switchTab('design')">
      AI × Design <span class="tab-count" id="count-design"></span>
    </button>
    <button class="tab" data-cat="product-design" onclick="switchTab('product-design')">
      AI × Product Design <span class="tab-count" id="count-product-design"></span>
    </button>
    <button class="tab" data-cat="product-management" onclick="switchTab('product-management')">
      AI × Product Management <span class="tab-count" id="count-product-management"></span>
    </button>
  </div>

  <div id="content">
    <div class="empty-state">
      <div class="empty-icon">⚡</div>
      <div class="empty-title">No signal yet</div>
      <div class="empty-sub">Hit "Load Feed" to pull the latest<br>AI × Design &amp; Product content from across the web.</div>
    </div>
  </div>
</div>

<script>
let activeTab = 'design';
let feedData = {};

const SOURCE_SVG = {
  youtube:  `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,
  twitter:  `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
  linkedin: `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`,
  reddit:   `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>`,
  github:   `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`,
  article:  `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
};

function switchTab(cat) {
  activeTab = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  renderCards();
}

function setLoading(on) {
  const btn = document.getElementById('fetch-btn');
  btn.disabled = on;
  btn.innerHTML = on
    ? `<svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Scanning sources…`
    : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> ${Object.keys(feedData).length ? 'Refresh Feed' : 'Load Feed'}`;
}

function showSkeletons() {
  document.getElementById('content').innerHTML = `
    <div class="skel-scanning">Searching Reddit, YouTube, X, LinkedIn, GitHub &amp; publications…</div>
    ${[...Array(5)].map(() => `
      <div class="skeleton">
        <div class="skel-line" style="width:58%;margin-bottom:11px"></div>
        <div class="skel-line" style="width:92%"></div>
        <div class="skel-line" style="width:76%"></div>
      </div>`).join('')}`;
}

function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="error-box">${msg}</div>`;
}

function escHtml(s = '') {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCards() {
  const items = feedData[activeTab] || [];
  const content = document.getElementById('content');
  if (!items.length) {
    content.innerHTML = `<div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-title">No signal yet</div><div class="empty-sub">Hit "Load Feed" to pull the latest<br>AI × Design &amp; Product content.</div></div>`;
    return;
  }
  content.innerHTML = items.map(item => {
    const icon = SOURCE_SVG[item.source] || SOURCE_SVG.article;
    const age = item.daysAgo != null ? `<span class="card-age">${item.daysAgo === 0 ? 'today' : item.daysAgo + 'd ago'}</span>` : '';
    return `
      <a class="card" href="${escHtml(item.url)}" target="_blank" rel="noopener noreferrer">
        <div class="card-header">
          <div class="card-title">${escHtml(item.title)}</div>
          <div class="card-ext"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></div>
        </div>
        <div class="card-snippet">${escHtml(item.snippet)}</div>
        <div class="card-meta">
          <span class="source-tag ${activeTab}">${icon} ${escHtml(item.sourceName)}</span>
          ${age}
        </div>
      </a>`;
  }).join('');
}

function updateCounts() {
  ['design','product-design','product-management'].forEach(cat => {
    const n = (feedData[cat] || []).length;
    const el = document.getElementById('count-' + cat);
    const tab = document.querySelector(`.tab[data-cat="${cat}"]`);
    if (n) { el.textContent = n; tab.classList.add('has-count'); }
  });
}

async function fetchFeed() {
  setLoading(true);
  showSkeletons();
  feedData = {};
  try {
    const res = await fetch('/api/feed');
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    feedData = data.clusters || {};
    updateCounts();
    renderCards();
    const lf = document.getElementById('last-fetched');
    lf.textContent = 'Last fetched ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    lf.style.display = 'block';
  } catch(err) {
    showError(`Something went wrong: ${err.message}`);
  } finally {
    setLoading(false);
  }
}
</script>
</body>
</html>
